apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Le tag d'image ':latest' est interdit. Utilisez un tag explicite et versionné."
        pattern:
          spec:
            containers:
              - image: "!*:latest"